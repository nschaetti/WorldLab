[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "worldlab"
version = "0.1.0"
description = "Research tools for world models and joint-embedding predictive architectures"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = ["torch>=2.5"]

[project.optional-dependencies]
lejepa = ["torchvision>=0.20", "timm>=1.0.20,<1.1", "PyYAML>=6", "scipy>=1.11", "filelock>=3"]
imagenette = ["datasets>=3"]
board = [
    "numpy", "PyYAML>=6", "rich", "matplotlib", "seaborn", "pygame",
    "transformers>=4.40,<5", "tokenizers", "huggingface-hub", "safetensors",
    "wandb", "torchmetrics",
]

[project.scripts]
worldlab-lejepa = "worldlab.experiments.lejepa.cli:main"

[tool.setuptools.packages.find]
include = ["worldlab*", "boardGPT*"]

[tool.setuptools.package-data]
"worldlab.experiments.lejepa" = ["presets.yaml"]
